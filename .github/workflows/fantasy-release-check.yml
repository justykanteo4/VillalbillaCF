name: Fantasy release checks (web Android iOS)
on:
  pull_request:
    paths:
      - 'Fantasy*.js'
      - 'AdminResultAudit.js'
      - 'AdminHub.js'
      - 'AdminSystemStatus.js'
      - 'activity-service.mjs'
      - 'activity.test.mjs'
      - 'ClubResultEditor.js'
      - 'club-result-editor-ui*'
      - 'result-edits*'
      - 'club-result-authorization*'
      - 'fantasy-*'
      - 'app.json'
      - 'app.config.js'
      - 'eas.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/fantasy-release-check.yml'
  push:
    branches:
      - feat/fantasy-clausulas-150
jobs:
  business-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Verify Fantasy clause and trade rules
        run: node offline-policy-cache.test.cjs && node --test fantasy-unlimited-transfers.test.mjs fantasy-clauses.test.cjs fantasy-market-extensions.test.mjs fantasy-league-reset.test.mjs fantasy-sales.test.mjs fantasy-economy.test.mjs fantasy-game.test.mjs fantasy-service.test.mjs && node --test club-result-editor-ui.test.cjs result-edits.test.mjs club-result-authorization.test.mjs && node --test release-launcher.test.cjs activity.test.mjs publish-verified-windows.test.cjs
  # Platform bundles must work before a native build or public deployment.
  platform-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Export web, Android and iOS JS bundles
        run: pnpm exec expo export --platform all --output-dir work/verify-all-platforms
