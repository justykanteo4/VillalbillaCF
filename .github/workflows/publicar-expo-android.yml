name: Publicar actualización Android en Expo

on:
  workflow_dispatch:
    inputs:
      message:
        description: Descripción de los cambios
        required: false
        default: Correcciones de banners en Noticias

permissions:
  contents: read

concurrency:
  group: villalbilla-expo-production-android
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
    steps:
      - name: Obtener código actualizado
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Activar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Validar autorización Expo
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta EXPO_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Comprobar configuración pública
        run: node scripts/check-update-config.cjs

      - name: Ejecutar pruebas
        run: pnpm test

      - name: Exportar actualización Android
        run: pnpm run export:android-update

      - name: Publicar en Expo production
        run: >-
          pnpm dlx eas-cli@25.3.0 update
          --channel production
          --platform android
          --environment production
          --input-dir work/ota-export
          --skip-bundler
          --non-interactive
          --message "${{ inputs.message }}"
