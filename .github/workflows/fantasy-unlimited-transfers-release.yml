name: Fantasy unlimited transfers release (D1 web Android)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: villalbilla-fantasy-unlimited-transfers-release
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/fantasy-clausulas-150')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      VILLALBILLA_UPDATE_RUNTIME: '0.1.12'
      EXPO_PUBLIC_FIREBASE_API_KEY: 'AIzaSyA88kjp4vnyNZMdN1gO6FI2wM2TsA0pbGQ'
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: 'villalbillacf.firebaseapp.com'
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: 'villalbillacf'
      EXPO_PUBLIC_FIREBASE_APP_ID: '1:758134560563:web:fc2aaa8c8b9c38d60fd046'
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '758134560563'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run unrestricted-transfer tests and Fantasy regression suite
        run: |
          node --test fantasy-unlimited-transfers.test.mjs
          pnpm run check:fantasy-clauses
          pnpm run check:release
      - name: Verify production credentials and exact D1 database target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$EXPO_TOKEN"
          grep -q '3299f93d-9059-41b8-946c-b2668d255cc9' wrangler.jsonc
          test -s fantasy-unlimited-transfers.sql
      - name: Create pre-change backup and verify 91 application table declarations
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 export villalbilla-chats --remote --output backup-unlimited-transfers.sql
          test -s backup-unlimited-transfers.sql
          count=$(grep -ic 'CREATE TABLE' backup-unlimited-transfers.sql || true)
          echo "SQL table declarations in pre-migration export: $count"
          test "$count" -ge 91
          echo "Backup kept private on temporary CI runner; original user copy must be retained."
      - name: Apply single-trigger removal of weekly signing limit to production D1
        run: pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-unlimited-transfers.sql
      - name: Verify production trade guard has no quota but retains money and squad checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT sql FROM sqlite_master WHERE name='fantasy_trade_guard' AND type='trigger';" > /tmp/guard.txt
          if grep -q FANTASY_TRANSFERS /tmp/guard.txt; then echo "::error::Weekly transfer quota remains in live D1 guard"; exit 1; fi
          for key in FANTASY_FUNDS FANTASY_ROSTER_MAX FANTASY_OWNED FANTASY_OFFER_CHANGED; do
            grep -q "$key" /tmp/guard.txt || { echo "::error::Guard missing $key"; exit 1; }
          done
          echo "Live D1 guard verified: unlimited transfers; funds/roster/ownership checks preserved."
      - name: Deploy web and Worker with Firebase login configuration
        shell: bash
        run: pnpm run deploy:cloudflare
      - name: Fetch Expo production Android environment without exposing values
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx eas-cli@25.3.0 env:pull --environment production --path .env.local --non-interactive > /tmp/expo-env.log
          node --env-file=.env.local scripts/check-update-config.cjs
          pnpm exec expo config --json > /tmp/expo-runtime.json
          node -e "const c=require('/tmp/expo-runtime.json');if(c.runtimeVersion!=='0.1.12'||c.updates?.requestHeaders?.['expo-channel-name']!=='production')throw Error('Wrong OTA runtime/channel')"
      - name: Export Android OTA bundle only for runtime 0.1.12
        run: pnpm exec expo export --platform android --output-dir work/ota-export
      - name: Publish Android 0.1.12 OTA to production
        run: pnpm dlx eas-cli@25.3.0 update --channel production --platform android --environment production --input-dir work/ota-export --skip-bundler --non-interactive --message "Villalbilla Fantasy · fichajes ilimitados y ofertas corregidas (0.1.12)"
