name: Fantasy manual stats D1 migration (backup first)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fantasy-stat-corrections-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify production database and migration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -q '"database_name": "villalbilla-chats"' wrangler.jsonc
          grep -q '3299f93d-9059-41b8-946c-b2668d255cc9' wrangler.jsonc
          test -s fantasy-stat-corrections-schema.sql
      - name: Back up production before changes (never upload private database)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 export villalbilla-chats --remote --output backup-before-manual-fantasy-stats.sql
          test -s backup-before-manual-fantasy-stats.sql
          grep -q 'CREATE TABLE' backup-before-manual-fantasy-stats.sql
      - name: Create additive stats tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-stat-corrections-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('fantasy_stat_corrections','fantasy_stat_correction_history') ORDER BY name;"
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT COUNT(*) AS corrections FROM fantasy_stat_corrections;"
