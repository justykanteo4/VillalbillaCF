permissions:
  contents: read
concurrency:
  group: villalbilla-fantasy-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Partial release explicitly requested by the Club. Do not claim the 77 options are complete.
      - name: Verify the 77-feature inventory without certifying incomplete items
        run: node --test settings-upgrade-catalog.test.cjs
      - name: Prepare public release data
        run: pnpm run prepare:release-data
      - name: Verify cache, business rules and release data
        run: |
          node official-cache.test.mjs
          node offline-policy-cache.test.cjs
          pnpm run check:fantasy-clauses
          node --test admin-match-tasks.test.mjs
          pnpm run check:release
      - name: Verify frozen Fantasy styles
        run: node --test fantasy-style-render.test.cjs
      - name: Verify Fantasy player display names
        run: node --test fantasy-display-names.test.cjs
      - name: Export all three app bundles
        run: pnpm exec expo export --platform all --output-dir work/verify-release
      - name: Package prepared public data
        run: tar -czf /tmp/release-data.tgz assets/offline/club.clubdata bundled-data-manifest.json club-cards-seed.json club-goalkeepers-seed.json news-seed.json reinforcements-seed.json social-candidates.json social-matches.json fantasy-players.json fantasy-membership.json fantasy-sports.json
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-release-data
          path: /tmp/release-data.tgz

  deploy-web:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPO_PUBLIC_FIREBASE_API_KEY: 'AIzaSyA88kjp4vnyNZMdN1gO6FI2wM2TsA0pbGQ'
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: 'villalbillacf.firebaseapp.com'
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: 'villalbillacf'
      EXPO_PUBLIC_FIREBASE_APP_ID: '1:758134560563:web:fc2aaa8c8b9c38d60fd046'
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '758134560563'
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: prepared-release-data
          path: /tmp/prepared-release-data
      - name: Restore verified public data
        run: tar -xzf /tmp/prepared-release-data/release-data.tgz && pnpm run check:release
      - name: Backup D1 and migrate Fantasy team photos
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler d1 export villalbilla-chats --remote --output /tmp/fantasy-backup-before-photos.sql
          test -s /tmp/fantasy-backup-before-photos.sql
          count=$(grep -ic 'CREATE TABLE' /tmp/fantasy-backup-before-photos.sql || true)
          if [ "$count" -lt 80 ]; then echo "::error::Incomplete database backup; migration cancelled"; exit 1; fi
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-team-photos-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-coach-photos-schema.sql
          echo "Created or verified Fantasy public team photo table; backup retained privately on runner."
      - name: Migrate additive Fantasy player statistics after verified backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-stat-corrections-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT COUNT(*) AS corrections FROM fantasy_stat_corrections;"
      - name: Migrate additive league administrator history (after verified backup)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-league-admin-history-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT COUNT(*) AS events FROM fantasy_league_admin_events;"
      - name: Migrate additive scoring rule history (after verified backup)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-point-history-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT COUNT(*) AS revisions FROM fantasy_point_history;"
      - name: Install guarded league lifecycle after verified D1 backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-league-lifecycle-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='table' AND name='fantasy_league_lifecycle';"
      - name: Install guarded Fantasy player blocks (after verified D1 backup)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-player-blocks-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='table' AND name='fantasy_player_blocks';"
      - name: Configure optional Fantasy market dates after verified backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-market-window-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='table' AND name='fantasy_market_windows';"
      - name: Configure automatic market capacity after D1 backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-market-slot-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='table' AND name='fantasy_market_slot_settings';"
      - name: Enable team photo privacy after verified D1 backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-team-photo-privacy-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='table' AND name='fantasy_team_photo_privacy';"
      - name: Install Fantasy double-matchweek rules after verified D1 backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-special-rounds-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='table' AND name='fantasy_special_rounds';"
      - name: Enforce server-side Club lineup locks (after verified backup)
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-lineup-lock-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('fantasy_lineup_club_lock_insert','fantasy_lineup_club_lock_update');"
      - name: Create new leagues switch in D1 (preserve existing leagues)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-league-creation-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT id,enabled,revision FROM fantasy_league_creation_settings WHERE id=1"
      - name: Migrate Fantasy exchanges (after verified backup)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-exchanges-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='table' AND name='fantasy_player_exchanges';"
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name='fantasy_exchange_settle';"
      - name: Migrate Fantasy loans safely (after verified backup)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-loans-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='table' AND name='fantasy_player_loans';"
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT COUNT(*) AS loan_count FROM fantasy_player_loans;"
      - name: Verify and migrate historical sale rate without replaying payments
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/fantasy-backup-before-photos.sql
          python3 - <<'PY'
          import sqlite3, time, uuid
          db=sqlite3.connect(':memory:')
          db.executescript(open('/tmp/fantasy-backup-before-photos.sql').read())
          db.execute('PRAGMA foreign_keys=ON')
          snapshots={t:db.execute('SELECT * FROM '+t+' ORDER BY 1,2').fetchall() for t in ('fantasy_player_sales','fantasy_resale_listings','fantasy_roster','fantasy_wallet_cents','fantasy_wallet_values','fantasy_wallets')}
          db.executescript(open('fantasy-sale-rate-migration.sql').read())
          for t,rows in snapshots.items():
              assert rows==db.execute('SELECT * FROM '+t+' ORDER BY 1,2').fetchall(), 'Migration changed '+t
          assert not db.execute('PRAGMA foreign_key_check').fetchall(), 'Foreign key check failed'
          rows=db.execute("""SELECT r.id,r.league_id,r.uid,r.player_id,COALESCE(p.revision,0),COALESCE(p.price_cents,819)
          FROM fantasy_roster r JOIN fantasy_managers m ON m.league_id=r.league_id AND m.uid=r.uid
          LEFT JOIN fantasy_player_cents p ON p.player_id=r.player_id
          WHERE (SELECT COUNT(*) FROM fantasy_roster x WHERE x.league_id=r.league_id AND x.uid=r.uid)>12
          AND NOT EXISTS(SELECT 1 FROM fantasy_market_listings l WHERE l.league_id=r.league_id AND l.player_id=r.player_id AND l.retired_day IS NULL)
          LIMIT 30""").fetchall()
          ok=0
          for own,league,uid,player,revision,price in rows:
              db.execute('SAVEPOINT sale_probe')
              try:
                  before=db.execute('SELECT delta_cents FROM fantasy_wallet_cents WHERE league_id=? AND uid=?',(league,uid)).fetchone()[0]
                  amount=(price*60+50)//100
                  db.execute('INSERT INTO fantasy_player_sales VALUES(?,?,?,?,?,?,?,?,?,?)',(str(uuid.uuid4()),league,uid,player,own,str(uuid.uuid4()),price,amount,revision,int(time.time()*1000)))
                  assert db.execute('SELECT delta_cents FROM fantasy_wallet_cents WHERE league_id=? AND uid=?',(league,uid)).fetchone()[0]==before+amount
                  assert not db.execute('SELECT 1 FROM fantasy_roster WHERE id=?',(own,)).fetchone()
                  ok+=1
              except sqlite3.Error as exc:
                  if not any(x in str(exc) for x in ('FANTASY_LOAN_PLAYER_LOCKED','FANTASY_LOAN_BORROWER_MIN')): raise
              finally:
                  db.execute('ROLLBACK TO sale_probe')
                  db.execute('RELEASE sale_probe')
          assert ok>0, 'No successful production-copy sale probe'
          print('Production copy verified; successful 60 percent sale probes:',ok)
          PY
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-sale-rate-migration.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE name IN ('fantasy_player_sales','fantasy_sale_settle','fantasy_sale_relist','fantasy_resale_register');"
      - name: Migrate Fantasy season archives after verified backup
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -s /tmp/fantasy-backup-before-photos.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-seasons-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='table' AND name='fantasy_season_archives';"
      - name: Migrate administrator Fantasy scoring settings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-points-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT id,revision FROM fantasy_point_settings WHERE id=1"
      - name: Verify current D1 schema (read only)
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type IN ('table','trigger') AND name IN ('fantasy_clause_boosts','fantasy_clause_boost_events','fantasy_clause_purchases','fantasy_manager_listings','fantasy_clause_boost_guard','fantasy_clause_boost_apply','fantasy_clause_purchase_guard','fantasy_clause_offer_proof','fantasy_manager_listing_guard','fantasy_manager_offer_proof','fantasy_sale_manager_listing_guard','fantasy_team_photos','fantasy_league_creation_settings','fantasy_point_settings','fantasy_stat_corrections','fantasy_stat_correction_history','fantasy_league_admin_events','fantasy_point_history','fantasy_league_lifecycle','fantasy_player_blocks','fantasy_market_windows','fantasy_market_slot_settings','fantasy_team_photo_privacy','fantasy_special_rounds') ORDER BY name;" > /tmp/schema.json
          for name in fantasy_clause_boosts fantasy_clause_boost_events fantasy_clause_purchases fantasy_manager_listings fantasy_clause_boost_guard fantasy_clause_boost_apply fantasy_clause_purchase_guard fantasy_clause_offer_proof fantasy_manager_listing_guard fantasy_manager_offer_proof fantasy_sale_manager_listing_guard fantasy_team_photos fantasy_league_creation_settings fantasy_point_settings fantasy_stat_corrections fantasy_stat_correction_history fantasy_league_admin_events fantasy_point_history fantasy_league_lifecycle fantasy_player_blocks fantasy_market_windows fantasy_market_slot_settings fantasy_team_photo_privacy fantasy_special_rounds; do
            grep -q "\"$name\"" /tmp/schema.json || { echo "::error::Missing D1 schema: $name. Deployment blocked."; exit 1; }
          done
      - name: Deploy Cloudflare Worker + web
        run: pnpm exec expo export --platform web && pnpm exec wrangler deploy --keep-vars

  publish-android:
    needs: deploy-web
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: prepared-release-data
          path: /tmp/prepared-release-data
      - name: Restore verified public data
        run: tar -xzf /tmp/prepared-release-data/release-data.tgz && pnpm run check:release
      - name: Pull production Expo configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EXPO_TOKEN"
          pnpm dlx eas-cli@25.3.0 env:pull --environment production --path .env.local --non-interactive >/tmp/eas-env.log
          node --env-file=.env.local scripts/check-update-config.cjs
      - name: Publish Android 0.1.12 runtime OTA
        env:
          VILLALBILLA_UPDATE_RUNTIME: '0.1.12'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec expo config --json >/tmp/expo-012.json
          node -e "const c=require('/tmp/expo-012.json');if(c.runtimeVersion!=='0.1.12'||c.updates?.requestHeaders?.['expo-channel-name']!=='production')throw Error('Wrong runtime/channel for 0.1.12')"
          pnpm exec expo export --platform android --output-dir work/ota-012
          pnpm dlx eas-cli@25.3.0 update --channel production --platform android --environment production --input-dir work/ota-012 --skip-bundler --non-interactive --message "Fantasy: tres o más MVP por victoria (0.1.12)"
      - name: Publish Android 0.1.13 runtime OTA
        env:
          VILLALBILLA_UPDATE_RUNTIME: '0.1.13'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec expo config --json >/tmp/expo-013.json
          node -e "const c=require('/tmp/expo-013.json');if(c.runtimeVersion!=='0.1.13'||c.updates?.requestHeaders?.['expo-channel-name']!=='production')throw Error('Wrong runtime/channel for 0.1.13')"
          pnpm exec expo export --platform android --output-dir work/ota-013
          pnpm dlx eas-cli@25.3.0 update --channel production --platform android --environment production --input-dir work/ota-013 --skip-bundler --non-interactive --message "Fantasy: tres o más MVP por victoria (0.1.13)"
      - name: Publish iOS 0.1.13 runtime OTA
        env:
          VILLALBILLA_UPDATE_RUNTIME: '0.1.13'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec expo config --json >/tmp/expo-ios-013.json
          node -e "const c=require('/tmp/expo-ios-013.json');if(c.runtimeVersion!=='0.1.13'||c.updates?.requestHeaders?.['expo-channel-name']!=='production'||!c.ios?.bundleIdentifier)throw Error('Wrong iOS runtime/channel/bundle')"
          pnpm exec expo export --platform ios --output-dir work/ota-ios-013
          pnpm dlx eas-cli@25.3.0 update --channel production --platform ios --environment production --input-dir work/ota-ios-013 --skip-bundler --non-interactive --message "Ajustes Club y usuarios iOS (0.1.13)"
