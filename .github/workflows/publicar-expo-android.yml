name: Publicar VillalbillaCF en Android, iOS y web
# Publicación automática multiplataforma en producción; iOS requiere una app nativa instalada compatible.
run-name: Publicación Android + iOS + web · ${{ github.event_name == 'push' && 'automática' || 'manual' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      message:
        description: Descripción de los cambios
        required: false
        default: Actualización VillalbillaCF Android, iOS y web

permissions:
  contents: read

concurrency:
  group: villalbilla-expo-production-multiplataforma
  cancel-in-progress: false

jobs:
  publish-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      UPDATE_MESSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.message || format('Actualización automática VillalbillaCF {0}', github.sha) }}
    steps:
      - name: Obtener código actualizado
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Activar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Validar autorización Expo
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Falta EXPO_TOKEN en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Recuperar configuración production desde Expo
        run: pnpm dlx eas-cli@25.3.0 env:pull --environment production --path .env.local --non-interactive

      - name: Comprobar configuración pública
        run: node --env-file=.env.local scripts/check-update-config.cjs

      - name: Ejecutar pruebas
        run: pnpm test

      - name: Exportar y publicar Android 0.1.12 y 0.1.13
        shell: bash
        run: |
          set -euo pipefail
          for runtime in 0.1.12 0.1.13; do
            echo "::group::Publicación Expo Android runtime $runtime"
            export VILLALBILLA_UPDATE_RUNTIME="$runtime"
            # Expo reconoce el runtime específico en app.config.js.
            pnpm run export:android-update
            pnpm dlx eas-cli@25.3.0 update \
              --channel production \
              --platform android \
              --environment production \
              --input-dir work/ota-export \
              --skip-bundler \
              --non-interactive \
              --message "$UPDATE_MESSAGE ($runtime)"
            echo "::endgroup::"
          done

      - name: Exportar y publicar iOS 0.1.12 y 0.1.13
        shell: bash
        run: |
          set -euo pipefail
          for runtime in 0.1.12 0.1.13; do
            echo "::group::Publicación Expo iOS runtime $runtime"
            export VILLALBILLA_UPDATE_RUNTIME="$runtime"
            pnpm exec expo export --platform ios --output-dir work/ota-export-ios
            pnpm dlx eas-cli@25.3.0 update \
              --channel production \
              --platform ios \
              --environment production \
              --input-dir work/ota-export-ios \
              --skip-bundler \
              --non-interactive \
              --message "$UPDATE_MESSAGE (iOS $runtime)"
            echo "::endgroup::"
          done

  publish-web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Obtener código actualizado
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Activar pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10 --activate

      - name: Verificar credenciales de publicación web
        shell: bash
        run: |
          set -euo pipefail
          for name in EXPO_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta $name en Secrets and variables > Actions."
              exit 1
            fi
          done

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Recuperar configuración pública desde Expo
        run: pnpm dlx eas-cli@25.3.0 env:pull --environment production --path .env.local --non-interactive

      - name: Comprobar configuración de la aplicación
        run: node --env-file=.env.local scripts/check-update-config.cjs

      - name: Ejecutar pruebas
        run: pnpm test

      - name: Preparar y validar datos públicos
        run: |
          pnpm run prepare:release-data
          pnpm run check:release

      - name: Exportar web y publicar Cloudflare Worker
        run: pnpm run deploy:cloudflare

      - name: Instalar navegador de prueba
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install chromium --with-deps

      - name: Verificar arranque real de web
        run: node scripts/smoke-web.cjs

      - name: Guardar captura y diagnóstico web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-web
          path: web-smoke.png
          if-no-files-found: ignore
