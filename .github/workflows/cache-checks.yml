name: Validate and publish competition cache
on:
  push:
    branches: [main]
    paths:
      - 'api.js'
      - 'official-cache.js'
      - 'official-cache.test.mjs'
      - 'Club.js'
      - 'Standings.js'
      - 'News.js'
      - 'Players.js'
      - 'MatchEvents.js'
      - '.github/workflows/cache-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: |
          node logic.test.mjs
          node official-cache.test.mjs
      - name: Validate Expo web and Android bundles
        run: |
          npx expo export --platform web
          npx expo export --platform android

  publish-preview:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Expo authorization
        id: expo
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EXPO_TOKEN is not set. Skipping OTA publication."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install dependencies
        if: steps.expo.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund
      - name: Publish Android OTA to preview
        if: steps.expo.outputs.configured == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          CI: '1'
        run: npx --yes eas-cli@latest update --channel preview --platform android --non-interactive --message "Caché de actas, jornadas y plantillas"
