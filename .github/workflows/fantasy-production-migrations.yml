name: Fantasy D1 production migrations (backup and verify)
on:
  pull_request:
    paths:
      - '.github/workflows/fantasy-production-migrations.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fantasy-d1-production-migration
  cancel-in-progress: false
jobs:
  migrate:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/fantasy-clausulas-150')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.29.3'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm selected production database and token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          grep -q '"database_name": "villalbilla-chats"' wrangler.jsonc
          grep -q '3299f93d-9059-41b8-946c-b2668d255cc9' wrangler.jsonc
          test -s fantasy-clause-schema.sql && test -s fantasy-manager-listings-schema.sql
      - name: Create independent temporary pre-migration SQL export and verify table definitions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 export villalbilla-chats --remote --output backup-before-fantasy-migration.sql
          test -s backup-before-fantasy-migration.sql
          count=$(grep -ic 'CREATE TABLE' backup-before-fantasy-migration.sql || true)
          echo "Database SQL export has $count table declarations (expected at least 91)."
          if [ "$count" -lt 91 ]; then
            echo "::error::Unexpectedly incomplete SQL backup. No schema migration was attempted."
            exit 1
          fi
          echo "Temporary export retained only on runner, not uploaded to public artifacts. User has a local backup."
      - name: Apply fantasy clause and manager-auction migrations to Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-clause-schema.sql
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --file fantasy-manager-listings-schema.sql
      - name: Verify the tables and triggers exist without changing user data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('fantasy_clause_boosts','fantasy_clause_boost_events','fantasy_clause_purchases','fantasy_manager_listings') ORDER BY name;"
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('fantasy_clause_boost_guard','fantasy_clause_purchase_guard','fantasy_manager_listing_guard','fantasy_manager_offer_proof','fantasy_offer_limit') ORDER BY name;"
          pnpm exec wrangler d1 execute villalbilla-chats --remote --yes --command "SELECT COUNT(*) AS table_count_excluding_cloudflare_internal FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name!='_cf_KV';"
          echo "Production D1 migrations submitted. This workflow does not deploy Worker/web or Android."
